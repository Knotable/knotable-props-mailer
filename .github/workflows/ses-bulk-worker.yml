name: SES Autopilot

# Sends every campaign approved in the app (Queue -> Send), without a browser
# and without a manual dispatch. The schedule re-enters the worker every five
# minutes; an idle tick is a ~10-second probe. Scheduled runs only fire from
# the default branch.
on:
  schedule:
    # Offset from :00 — GitHub delays schedules that fire on the hour.
    - cron: "4-59/5 * * * *"
    # Weekly keepalive: GitHub disables schedules in public repositories after
    # 60 days without repository activity, which would silently stop sends.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: autopilot drains every approved campaign; send approves and drains one; dry-run is read-only
        required: true
        default: autopilot
        type: choice
        options:
          - autopilot
          - send
          - dry-run
      email_id:
        description: Campaign UUID (required for send and dry-run; optional filter for autopilot)
        required: false
        type: string
      confirmation:
        description: For send mode, enter send:<campaign UUID>
        required: false
        type: string
      max_recipients_per_second:
        description: Target SES acceptance rate (capped at 90% of the live SES rate)
        required: false
        default: "13"
        type: string

permissions:
  contents: read

jobs:
  keepalive:
    if: github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (resets the 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ses-bulk-worker.yml/enable"

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      due: ${{ steps.probe.outputs.due }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - id: probe
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SES_REPORT_DELAY_HOURS: ${{ vars.SES_REPORT_DELAY_HOURS || '24' }}
        run: node scripts/autopilot-probe.mjs

  drain:
    needs: probe
    if: github.event_name != 'schedule' || needs.probe.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # One sender at a time across all campaigns: SES quota is account-wide.
    concurrency:
      group: ses-sender
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://knotable-props-mailer.vercel.app' }}
      SES_OPERATOR_EMAIL: ${{ vars.SES_OPERATOR_EMAIL || 'a@sarva.co' }}
      SES_NOTIFY_FROM: ${{ vars.SES_NOTIFY_FROM }}
      SES_BULK_MAX_RECIPIENTS_PER_SECOND: ${{ inputs.max_recipients_per_second || vars.SES_AUTOPILOT_RATE || '13' }}
      SES_QUOTA_RESERVE: ${{ vars.SES_QUOTA_RESERVE || '500' }}
      SES_BULK_RECOVERY_PAUSE_EVERY: ${{ vars.SES_BULK_RECOVERY_PAUSE_EVERY || '0' }}
      SES_BULK_RECOVERY_PAUSE_MS: ${{ vars.SES_BULK_RECOVERY_PAUSE_MS || '0' }}
      SES_CANARY_RECIPIENTS: ${{ vars.SES_CANARY_RECIPIENTS || '300' }}
      SES_CANARY_WAIT_SECONDS: ${{ vars.SES_CANARY_WAIT_SECONDS || '180' }}
      SES_BREAKER_MAX_HARD_BOUNCE_RATE: ${{ vars.SES_BREAKER_MAX_HARD_BOUNCE_RATE || '0.05' }}
      SES_BREAKER_MAX_COMPLAINT_RATE: ${{ vars.SES_BREAKER_MAX_COMPLAINT_RATE || '0.003' }}
      SES_SEND_WINDOW: ${{ vars.SES_SEND_WINDOW }}
      # Reclaim dead queue rows every N accepted (needs SUPABASE_DB_CONNECTION; 0 = off).
      SES_QUEUE_VACUUM_EVERY: ${{ vars.SES_QUEUE_VACUUM_EVERY || '5000' }}
      # Fold finished, reported campaigns into the delivery ledger and delete their queue rows.
      SES_COMPACT_HISTORY: ${{ vars.SES_COMPACT_HISTORY || 'on' }}
      SES_COMPACT_AFTER_HOURS: ${{ vars.SES_COMPACT_AFTER_HOURS || '1' }}
      SES_REPORT_DELAY_HOURS: ${{ vars.SES_REPORT_DELAY_HOURS || '24' }}
      SES_WORKER_MAX_RUNTIME_MINUTES: "330"
      WORKER_MODE: ${{ inputs.mode || 'autopilot' }}
      WORKER_EMAIL_ID: ${{ inputs.email_id }}
      WORKER_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run SES worker
        run: >-
          node scripts/ses-bulk-worker.mjs
          --mode "$WORKER_MODE"
          --email-id "$WORKER_EMAIL_ID"
          --confirmation "$WORKER_CONFIRMATION"
