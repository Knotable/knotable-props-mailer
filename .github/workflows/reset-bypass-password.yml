name: Reset bypass password

# Re-enables (or rotates) the emergency /login/bypass without Vercel access.
# If the repository secret BYPASS_PASSWORD is set, that password is used;
# otherwise a strong one is generated. Either way the login details are
# emailed to SES_OPERATOR_EMAIL (default a@sarva.co) and never printed,
# because this repository's Actions logs are public.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "rotate" to replace the current bypass password and sign out bypass sessions
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset:
    if: inputs.confirm == 'rotate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BYPASS_NEW_PASSWORD: ${{ secrets.BYPASS_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://knotable-props-mailer.vercel.app' }}
      SES_OPERATOR_EMAIL: ${{ vars.SES_OPERATOR_EMAIL || 'a@sarva.co' }}
      SES_NOTIFY_FROM: ${{ vars.SES_NOTIFY_FROM }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/set-bypass-password.mjs --deliver email
